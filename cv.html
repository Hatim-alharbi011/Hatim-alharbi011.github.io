<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>السيرة الذاتية</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts.css">
<style>
@page{size:A4;margin:12mm 0}
@page :first{margin-top:0}
*{box-sizing:border-box}
:root{--ink:#1F2328;--ink2:#4A5672;--ink3:#7B86A0;--line:#E2E6EF;--paper:#F5F7FC;--mint:#2EC4B6;--saffron:#FFB627;--coral:#FF5D73;--cobalt:#2F5BEA}
body{margin:0;font-family:"Cairo",sans-serif;color:var(--ink);font-size:9pt;line-height:1.55;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;position:relative}
.head{background:#1F2328;color:#fff;padding:10mm 14mm 8mm;display:grid;grid-template-columns:auto 1fr;gap:7mm;align-items:center;position:relative}
.head::after{content:"";position:absolute;inset:auto 0 0;height:2.2mm;background:linear-gradient(var(--dir),#2EC4B6,#FFB627,#FF5D73)}
.ph{width:30mm;height:28mm;border-radius:4mm;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#3A414B,#2B3037 60%)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center top}
h1{margin:0;font-size:22pt;font-weight:800;line-height:1.2}
.role{margin:1mm 0 0;color:#9BE3C6;font-weight:700;font-size:12pt}
.role b{font-size:8pt;background:#9BE3C6;color:#1F2328;border-radius:9px;padding:0 6px;margin-inline-start:4px;direction:ltr;display:inline-block}
.org{margin:0;color:rgba(255,255,255,.7);font-size:9pt}
.contact{display:flex;flex-wrap:wrap;gap:2mm 6mm;margin-top:2.5mm;font-size:8.6pt;color:rgba(255,255,255,.85)}
.contact span{direction:ltr;unicode-bidi:isolate}
.body{padding:6mm 14mm 0;display:grid;gap:4mm;align-content:start}
.cols{display:grid;grid-template-columns:1.55fr 1fr;gap:7mm}
h2{font-size:11.5pt;font-weight:800;margin:0 0 2mm;padding-bottom:1mm;border-bottom:.6mm solid var(--line);display:flex;align-items:center;gap:2mm}
h2::before{content:"";width:2.6mm;height:2.6mm;border-radius:.7mm;background:var(--k,var(--ink))}
p{margin:0}
.sum{color:var(--ink2);text-align:justify}
.job{margin-bottom:2.4mm;break-inside:avoid}
.job .t{display:flex;justify-content:space-between;gap:4mm;align-items:baseline}
.job h3{margin:0;font-size:10.4pt;font-weight:800}
.job .d{font-size:8.4pt;color:var(--ink3);white-space:nowrap}
.job .o{font-size:8.6pt;color:var(--ink2);margin:0 0 1mm}
ul{margin:0;padding-inline-start:4.5mm}
li{margin:0 0 .3mm}
li::marker{color:var(--k,var(--ink3))}
.ex{background:var(--paper);border-radius:2mm;padding:1.6mm 3mm;margin-top:1.2mm}
.ex h4{margin:0 0 .6mm;font-size:8.8pt;font-weight:800}
strong{font-weight:800}
.chip{display:inline-block;font-size:7.8pt;background:var(--paper);border-radius:8px;padding:0 6px;margin:0 0 1mm 1mm}
.cert{padding:1.1mm 0;border-bottom:.3mm solid var(--line);break-inside:avoid}
.cert:last-child{border:0}
.cert b{display:block;font-weight:800;font-size:9.4pt;line-height:1.4}
.cert span{color:var(--ink3);font-size:8.2pt}
.cert .v{color:#0E6B62;font-weight:700}
.list li{font-size:8.2pt;line-height:1.4}
.list2{display:grid;grid-template-columns:1fr 1fr;column-gap:7mm;list-style:none;padding:0}
.list2 li{font-size:8pt;padding:.5mm 0;border-bottom:.3mm solid var(--line);line-height:1.4}
.list2 li span{color:var(--ink3);font-size:7.4pt}
.list li span{color:var(--ink3);font-size:8pt}
.skillg{margin-bottom:1.6mm}
.skillg h3{margin:0 0 .6mm;font-size:9.6pt;font-weight:800}
.skillg li{font-size:8.1pt;line-height:1.45}
.foot{padding:4mm 14mm 6mm;font-size:7.6pt;color:var(--ink3);display:flex;justify-content:space-between}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
.ach div{background:var(--paper);border-radius:2mm;padding:1.8mm 3mm;border-top:.9mm solid var(--k)}
.ach b{display:block;font-size:13pt;font-weight:800;line-height:1.2;direction:ltr;unicode-bidi:isolate}
html[dir=rtl] .ach b{text-align:right}
.ach span{font-size:8.2pt;color:var(--ink2);line-height:1.4;display:block}

.job,.cert,.skillg,.ach div,.list2 li{break-inside:avoid}
h2{break-after:avoid}
.p2 .body{padding-top:2mm!important}
.foot{padding:6mm 14mm}
@media screen{
  html{background:#E9ECF2}
  body{padding:72px 0 40px}
  .page{margin:0 auto 18px;background:#fff;box-shadow:0 10px 40px -12px rgba(31,35,40,.35);min-height:297mm}
  .bar{position:fixed;inset:0 0 auto;height:56px;background:#1F2328;color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;z-index:5;font-family:"Cairo",sans-serif}
  .bar b{margin-inline-end:auto;font-weight:700}
  .bar a,.bar button{font:inherit;font-size:14px;border-radius:999px;padding:6px 16px;text-decoration:none;cursor:pointer;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff}
  .bar button{background:#FFB627;border-color:#FFB627;color:#1F2328;font-weight:700}
  @media (max-width:820px){.page{transform-origin:top center;zoom:calc(100vw / 820px)}body{padding-top:64px}}
}
@media print{.bar{display:none}}
</style></head><body>
<script src="content.js?v=202611101612"></script>
<script>
const lang=new URLSearchParams(location.search).get('lang')||'ar';const S=window.SITE,T=S[lang];
document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
document.documentElement.style.setProperty('--dir',lang==='ar'?'to left':'to right');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const CAT={risk:'#FF5D73',data:'#2EC4B6',fin:'#FFB627',people:'#2F5BEA'};
const L={ar:{save:'حفظ PDF',back:'العودة للموقع',hint:'اختر «حفظ بصيغة PDF» من نافذة الطباعة',sum:'الملخص المهني',exp:'الخبرات العملية',pro:'الشهادات المهنية',sk:'المهارات',edu:'التعليم',rec:'الدورات الحديثة',dev:'برامج ودورات أخرى',vol:'العمل التطوعي',ach:'إنجازات مختارة',p:'صفحة',web:'السيرة التفاعلية: الموقع الشخصي'},
         en:{save:'Save PDF',back:'Back to website',hint:'Choose “Save as PDF” in the print dialog',sum:'Professional summary',exp:'Experience',pro:'Professional certifications',sk:'Skills',edu:'Education',rec:'Recent courses',dev:'Other programmes & courses',vol:'Volunteering',ach:'Selected achievements',p:'Page',web:'Interactive CV: personal website'}}[lang];
const h=T.hero,a=T.about,P=T.path,K=T.certs,Sk=T.skills,Le=T.learn,W=T.work;
const head=`<header class="head"><div class="ph"><img src="${S.photo}"></div><div><h1>${esc(h.name)}</h1>
<p class="role">${esc(h.role)} ${h.badges.map(b=>`<b>${esc(b)}</b>`).join(' ')}</p><p class="org">${esc(h.org)}</p>
<div class="contact"><span>${esc(S.contact.email)}</span>${S.contact.phone?`<span>${esc(S.contact.phone.replace(/^(\d{3})(\d{3})(\d{4})$/,"$1 $2 $3"))}</span>`:""}<em style="font-style:normal">${esc(h.place)}</em>${S.contact.linkedin?`<span>${esc(S.contact.linkedin.replace(/^https?:\/\/(www\.)?/,''))}</span>`:''}${S.site?`<span>${esc(S.site.replace(/^https?:\/\//,''))}</span>`:''}</div></div></header>`;
const job=j=>`<div class="job" style="--k:${CAT[j.cat]}"><div class="t"><h3>${esc(j.role)}</h3><span class="d">${esc(j.dates)}</span></div>
<p class="o">${esc(j.org)} — ${esc(j.unit)}</p><ul>${j.points.map(p=>`<li>${md(p)}</li>`).join('')}</ul>
${j.extra?`<div class="ex"><h4>${esc(j.extraTitle)}</h4><ul>${j.extra.map(p=>`<li>${md(p)}</li>`).join('')}</ul></div>`:''}</div>`;
const pros=K.items.map((c,k)=>({...c,...S.certFiles[k]})).filter(c=>c.pro);
const others=K.items.map((c,k)=>({...c,...S.certFiles[k]})).filter(c=>!c.pro);
const recNames=new Set(Le.recent.map(r=>r.cert).filter(x=>x!=null));
const rest=K.items.map((c,k)=>({...c,k})).filter(c=>!c.pro&&!recNames.has(c.k));
const tr=W.training;
const pg1=`<section class="page">${head}<div class="body">
<div><h2 style="--k:#1F2328">${L.sum}</h2><p class="sum">${a.paragraphs.map(esc).join(' ')}</p></div>
<div><h2 style="--k:#FFB627">${L.ach}</h2><div class="ach">${(T.cvHighlights||[]).map(x=>`<div style="--k:${CAT[x.cat]||'#1F2328'}"><b>${esc(x.v)}</b><span>${esc(x.k)}</span></div>`).join('')}</div></div>
<div><h2 style="--k:#FF5D73">${L.exp}</h2>${P.jobs.map(job).join('')}</div>
</div></section>`;
const pg2=`<section class="page p2"><div class="body" style="padding-top:9mm;gap:3.2mm">
<div class="cols"><div>
<h2 style="--k:#FF5D73">${L.pro}</h2>${pros.map(c=>`<div class="cert"><b>${esc(c.name)}</b><span>${esc(c.issuer)} · ${esc(c.date)}${c.valid?` · <span class="v">${esc(c.valid)}</span>`:''}</span></div>`).join('')}
<h2 style="--k:#2F5BEA;margin-top:4mm">${L.sk}</h2>${Sk.groups.map(g=>`<div class="skillg" style="--k:${CAT[g.cat]}"><h3>${esc(g.title)}</h3><ul>${g.points.map(p=>`<li>${md(p)}</li>`).join('')}</ul></div>`).join('')}
</div><div>
<h2 style="--k:#FFB627">${L.edu}</h2><div class="cert"><b>${esc(Le.edu.degree)}</b><span>${esc(Le.edu.school)} · ${esc(Le.edu.years)}</span></div>
<h2 style="--k:#2EC4B6;margin-top:3mm">${L.rec}</h2><ul class="list">${Le.recent.map(r=>`<li>${esc(r.name)}<br><span>${esc(r.by)} · ${esc(r.meta)}</span></li>`).join('')}</ul>
<h2 style="--k:#2F5BEA;margin-top:3mm">${L.vol}</h2><div class="cert"><b>${esc(Le.vol.name)}</b><span>${esc(Le.vol.meta)}</span></div>
</div></div>
<div><h2 style="--k:#2EC4B6">${L.dev}</h2><ul class="list2">${rest.map(c=>`<li>${esc(c.name)} <span>— ${esc(c.issuer)} · ${esc(c.date)}</span></li>`).join('')}</ul></div>

</div><div class="foot"><span>${esc(h.name)}</span><span>${esc(S.site||'')}</span></div></section>`;
document.title=h.name+' — CV';
document.body.insertAdjacentHTML('beforeend',`<div class="bar"><b>${esc(h.name)}</b><a href="./">${L.back}</a><button type="button" onclick="window.print()" title="${L.hint}">${L.save}</button></div>`+pg1+pg2);
</script>
</body></html>
